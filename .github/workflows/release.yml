name: Release

# Pushing a version tag (git tag v1.0.0 && git push origin v1.0.0) tests that
# commit, then publishes the server and cluster-agent images for amd64 and
# arm64 to ghcr.io. The tag is the version: it is built into the binaries,
# so it is also the agent release the server publishes at startup.
# The packages are private like the repository; pulling them needs a login
# (README.md, "Run it").
#
# The agent binaries in the server image are signed during the build with
# the RELEASE_SIGNING_KEY secret of the "release" environment: one or two
# ed25519 private keys in PEM (openssl genpkey -algorithm ed25519), whose
# public keys are in internal/pki/release-keys.pem. Agents only install updates signed by
# those keys, so the server can't make one (docs/agent.md §5.2).

on:
  push:
    tags: ["v*"]

jobs:
  test:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    needs: test
    runs-on: ubuntu-latest
    # RELEASE_SIGNING_KEY is a secret of this environment.
    environment: release
    permissions:
      contents: read
      packages: write
    steps:
      - name: Release signing key is set and readable
        env:
          KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::The RELEASE_SIGNING_KEY secret is missing; agents would refuse this release."
            exit 1
          fi
          if ! printf '%s\n' "$KEY" | openssl pkey -noout 2>/dev/null; then
            echo "::error::RELEASE_SIGNING_KEY isn't a PEM private key; paste the whole file from openssl genpkey, BEGIN and END lines included."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: server
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/jw6ventures/baseline-server
          tags: |
            type=ref,event=tag
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ github.ref_name }}
          # Passed through the environment: the `secrets` input splits on
          # newlines, which cuts a PEM key down to its first line.
          secret-envs: release_signing_key=RELEASE_SIGNING_KEY
          tags: ${{ steps.server.outputs.tags }}
          labels: ${{ steps.server.outputs.labels }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - id: agent
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/jw6ventures/baseline-agent
          tags: |
            type=ref,event=tag
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        with:
          context: .
          target: agent
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ github.ref_name }}
          # The same secret: both images come from the same build stage.
          secret-envs: release_signing_key=RELEASE_SIGNING_KEY
          tags: ${{ steps.agent.outputs.tags }}
          labels: ${{ steps.agent.outputs.labels }}
          push: true
          cache-from: type=gha
